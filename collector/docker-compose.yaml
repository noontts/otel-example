service:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:lastest
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - 1888:1888 # pprof extension
      - 8888:8888 # Prometheus metrics exposed by the Collector
      - 8889:8889 # Prometheus exporter metrics
      - 13133:13133 # health_check extension
      - 4317:4317 # OTLP gRPC receiver
      - 4318:4318 # OTLP http receiver
      - 55679:55679 # zpages extension
    depends_on:
      jeager:
        condition: service_healthy
  jaeger:
    image: jeagertracing/all-in-one:lastest
    container_name: jaeger
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317"   # OTLP gRPC receiver (direct from app if not using collector)
      # Other Jaeger ports not strictly needed if only using OTel Collector to send to 14250
      # but good to expose for completeness or if you need other protocols
      # - "4318:4318" # OTLP HTTP receiver
      # - "6831:6831/udp" # Jaeger Agent Compact Thrift (UDP)
      # - "14268:14268" # Jaeger Collector Binary Thrift (HTTP)
      - "14250:14250" # Jaeger Collector gRPC (for OTel Collector's jaeger exporter)
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=9411
      - COLLECTOR_OTLP_ENABLED=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:16686"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - otel-network

networks:
  otel-network:
    driver: bridge
